name: Keep Streamlit & Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit App
        run: |
          # Пингва основния URL и здравето на Streamlit приложенията
          curl -sL -A "Mozilla/5.0" "https://yo-crm.streamlit.app" > /dev/null
          curl -sL -A "Mozilla/5.0" "https://yo-crm.streamlit.app/_stcore/health" > /dev/null

      - name: Ping Supabase Database Table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            # Изпълнява реална REST заявка към таблицата leads
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$SUPABASE_URL/rest/v1/leads?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Supabase Response Status: $STATUS"
          else
            echo "Supabase secrets are not set, skipping DB ping."
          fi
